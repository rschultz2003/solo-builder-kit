<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Sora';src:url('../node_modules/@fontsource/sora/files/sora-latin-600-normal.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Sora';src:url('../node_modules/@fontsource/sora/files/sora-latin-700-normal.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Jakarta';src:url('../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Jakarta';src:url('../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-500-normal.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Plex';src:url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2');font-weight:500}

:root{
  --paper:#FBFAF9; --ink:#16130F; --muted:#6E6860;
  --coral:#FF5A4E; --coral-deep:#C8341F; --peach:#FFB39A; --violet:#7C6CF5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:var(--paper);overflow:hidden;position:relative;font-family:'Jakarta',sans-serif}

/* warm ambient wash so the card is not flat white in a timeline */
.wash{position:absolute;inset:0;background:
  radial-gradient(720px 520px at 100% 0%, rgba(255,90,78,.13) 0%, rgba(255,90,78,0) 62%),
  radial-gradient(560px 460px at 88% 92%, rgba(124,108,245,.11) 0%, rgba(124,108,245,0) 60%);}

.orb{position:absolute;border-radius:50%}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.94) 0%,rgba(255,255,255,.32) 17%,rgba(255,255,255,0) 45%)}
.a{background:radial-gradient(circle at 32% 28%,#FF8A72 0%,#FF5A4E 46%,#D93A2E 100%)}
.b{background:radial-gradient(circle at 32% 28%,#FFD2BE 0%,#FFB39A 48%,#F08F6E 100%)}
.c{background:radial-gradient(circle at 32% 28%,#A79CFF 0%,#7C6CF5 48%,#5B4AD1 100%)}

#o1{width:300px;height:300px;top:96px;right:96px;box-shadow:0 44px 90px -30px rgba(217,58,46,.5)}
#o2{width:132px;height:132px;top:340px;right:302px;box-shadow:0 26px 54px -20px rgba(91,74,209,.5)}
#o3{width:82px;height:82px;top:60px;right:334px;box-shadow:0 18px 40px -14px rgba(240,143,110,.55)}

.pad{position:absolute;inset:0;padding:74px 78px;display:flex;flex-direction:column}
.eyebrow{font-family:'Plex',monospace;font-weight:500;font-size:17px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--coral-deep)}
.title{font-family:'Sora',sans-serif;font-weight:600;color:var(--ink);
  letter-spacing:-.032em;line-height:1.03;margin-top:auto;max-width:15ch}
.title.big{font-size:82px}
.title.mid{font-size:70px}
.grad{background:linear-gradient(120deg,#FF5A4E 0%,#7C6CF5 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:25px;color:var(--muted);margin-top:24px;max-width:30ch;line-height:1.42}

.foot{margin-top:auto;padding-top:44px;display:flex;align-items:center;gap:16px}
.dot{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#FF5A4E,#FFB39A);
  box-shadow:inset -5px -6px 12px rgba(160,40,25,.45), inset 5px 6px 12px rgba(255,255,255,.6)}
.who{font-family:'Sora',sans-serif;font-weight:600;font-size:23px;letter-spacing:-.02em;color:var(--ink)}
.handle{font-family:'Plex',monospace;font-weight:500;font-size:19px;color:var(--muted);margin-left:auto}
.rule{position:absolute;left:78px;right:78px;bottom:132px;height:1px;background:#EAE4DD}
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="orb a" id="o1"></div>
  <div class="orb c" id="o2"></div>
  <div class="orb b" id="o3"></div>
  <div class="rule"></div>
  <div class="pad">
    <p class="eyebrow" id="eyebrow">reubendorje.com</p>
    <h1 class="title big" id="title">I build software by myself, and I <span class="grad">give away the map</span>.</h1>
    <p class="sub" id="sub">Free playbooks for solo founders building with AI.</p>
    <div class="foot">
      <span class="dot"></span>
      <span class="who">Reuben Dorje</span>
      <span class="handle">@reubendorje</span>
    </div>
  </div>
</body>
</html>
