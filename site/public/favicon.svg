<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Reuben Dorje">
  <!-- The orb mark, simplified for small sizes. Same stops as og/favicon.html.
       Body is deliberately saturated so the specular has something to read
       against at 16px; the highlight is exaggerated past the web version. -->
  <defs>
    <radialGradient id="body" cx="34%" cy="28%" r="98%">
      <stop offset="0"    stop-color="#FFB39A"/>
      <stop offset="0.22" stop-color="#FF8A72"/>
      <stop offset="0.44" stop-color="#FF6A57"/>
      <stop offset="0.62" stop-color="#FF5A4E"/>
      <stop offset="0.86" stop-color="#D93A2E"/>
      <stop offset="1"    stop-color="#C8341F"/>
    </radialGradient>
    <radialGradient id="term" cx="72%" cy="78%" r="58%">
      <stop offset="0" stop-color="#962012" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#962012" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.26" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.80" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <g clip-path="url(#ball)">
    <circle cx="32" cy="32" r="32" fill="url(#body)"/>
    <circle cx="32" cy="32" r="32" fill="url(#term)"/>
    <circle cx="20" cy="15.2" r="12.8" fill="url(#spec)"/>
  </g>
</svg>
